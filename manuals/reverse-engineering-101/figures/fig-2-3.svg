  <text x="30" y="227" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.may_show_ui</text>
  <text x="250" y="227" font-size="12">false</text>
  <line x1="380" y1="223" x2="390" y2="223" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="227" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">true for every Hopper operation</text>
  <rect x="20" y="236" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="253" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.may_access_network</text>
  <text x="250" y="253" font-size="12">false</text>
  <line x1="380" y1="249" x2="390" y2="249" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="253" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">true for the IDA adapter</text>
  <rect x="20" y="262" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="279" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.may_write_filesystem</text>
  <text x="250" y="279" font-size="12">true</text>
  <line x1="380" y1="275" x2="390" y2="275" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="279" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">every Ghidra operation</text>
  <rect x="20" y="288" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="305" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.changes_permissions</text>
  <text x="250" y="305" font-size="12">false</text>
  <line x1="380" y1="301" x2="390" y2="301" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="305" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">false in the whole capture</text>
  <rect x="20" y="314" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="331" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.requires_root</text>
  <text x="250" y="331" font-size="12">false</text>
  <line x1="380" y1="327" x2="390" y2="327" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="331" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">false in the whole capture</text>
  <rect x="20" y="340" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="357" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">limitations</text>
  <text x="250" y="357" font-size="12">9 strings</text>
  <line x1="380" y1="353" x2="390" y2="353" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="357" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">4 session, 5 for the dossier</text>
</svg>
