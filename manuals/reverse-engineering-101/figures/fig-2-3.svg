<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">One capability record: analyze_function under ghidra</title>
  <desc id="fig-2-3-desc">The capability record for analyze_function in the ghidra candidate of rea capabilities, drawn as a table of twelve fields with the value each one holds and a note. operation is analyze_function. available is true, so reason and availability_code are null. Of the seven effects, launches_process and may_write_filesystem are true, as for every Ghidra operation, and mutates_artifact, may_show_ui, may_access_network, changes_permissions, and requires_root are false. limitations has 9 strings, 4 shared by the session and 5 specific to the dossier.</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE CAPABILITY RECORD</text>
  <text x="396" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT THE VALUE MEANS</text>
  <rect x="20" y="26" width="360" height="28" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="30" y="43.3" font-size="11" font-weight="700">analysis_provider_candidates[0].capabilities[2]</text>
  <rect x="20" y="54" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="71" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">operation</text>
  <text x="250" y="71" font-size="12">analyze_function</text>
  <line x1="380" y1="67" x2="390" y2="67" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="71" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">the MCP name</text>
  <rect x="20" y="80" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="97" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">available</text>
  <text x="250" y="97" font-size="12">true</text>
  <line x1="380" y1="93" x2="390" y2="93" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="97" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">false carries reason and code</text>
  <rect x="20" y="106" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="123" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">reason</text>
  <text x="250" y="123" font-size="12">null</text>
  <line x1="380" y1="119" x2="390" y2="119" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="123" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">text when available is false</text>
  <rect x="20" y="132" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="149" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">availability_code</text>
  <text x="250" y="149" font-size="12">null</text>
  <line x1="380" y1="145" x2="390" y2="145" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="396" y="149" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">a code when available is false</text>
  <rect x="20" y="158" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="175" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.mutates_artifact</text>
