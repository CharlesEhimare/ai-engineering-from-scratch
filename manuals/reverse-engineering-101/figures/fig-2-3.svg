  <text x="396" y="175" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">true for 3 Ghidra operations</text>
  <rect x="20" y="184" width="360" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="30" y="201" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">effects.launches_process</text>
