<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">WebAssembly on rea 6.4.0 and with wabt directly</title>
  <desc id="fig-6-2-desc">Left column, rea 6.4.0: the CLI command rea inspect-wasm-artifact answers COMMAND_NOT_FOUND, not a command for rea, and the MCP call tools/call inspect_wasm_artifact answers JSON-RPC error -32602, Tool inspect_wasm_artifact not found. Right column, wabt 1.0.42 with wasm-objdump -h -x on ledger.wasm, 290 bytes, wasm version 1: seven sections with their byte ranges and counts, Type 0x0a to 0x1a with 3 entries, Import 0x1c to 0x27 with 1, Function 0x29 to 0x2e with 4, Memory 0x30 to 0x33 with 1, Export 0x35 to 0x6e with 5, Code 0x71 to 0x10f with 4, and Data 0x111 to 0x122 with 1 segment. wasm2wat prints four functions, one import env.log, and a data segment at 1024.</desc>
  <defs><marker id="fig-6-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · REA 6.4.0</text>
  <rect x="20" y="28" width="290" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="47.25" font-size="12.5" text-anchor="middle" font-weight="700">rea inspect-wasm-artifact</text>
  <text x="165" y="64.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CLI, capture 16-inspect-wasm-artifact.json</text>
  <rect x="20" y="100" width="290" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="165" y="119.25" font-size="12.5" text-anchor="middle" font-weight="700">COMMAND_NOT_FOUND</text>
  <text x="165" y="136.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">not a command for &#39;rea&#39;</text>
  <line x1="165" y1="76" x2="165" y2="99" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <rect x="20" y="172" width="290" height="48" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="165" y="191.25" font-size="12.5" text-anchor="middle" font-weight="700">tools/call inspect_wasm_artifact</text>
  <text x="165" y="208.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">MCP, capture 10-mcp-24</text>
  <rect x="20" y="244" width="290" height="48" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="165" y="263.25" font-size="12.5" text-anchor="middle" font-weight="700">JSON-RPC error -32602</text>
  <text x="165" y="280.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Tool inspect_wasm_artifact not found</text>
  <line x1="165" y1="220" x2="165" y2="243" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-rose)"/>
  <text x="330" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · WABT 1.0.42, WASM-OBJDUMP -H -X</text>
  <rect x="330" y="28" width="290" height="26" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="44.45" font-size="11.5" font-weight="700">ledger.wasm, 290 bytes, wasm 0x1</text>
  <rect x="330" y="54" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="71" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Type</text>
  <text x="420" y="71" font-size="11">0x0a to 0x1a</text>
  <text x="545" y="71" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 3</text>
  <rect x="330" y="80" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="97" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Import</text>
  <text x="420" y="97" font-size="11">0x1c to 0x27</text>
  <text x="545" y="97" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 1</text>
  <rect x="330" y="106" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="123" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Function</text>
  <text x="420" y="123" font-size="11">0x29 to 0x2e</text>
  <text x="545" y="123" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 4</text>
  <rect x="330" y="132" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="149" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Memory</text>
  <text x="420" y="149" font-size="11">0x30 to 0x33</text>
  <text x="545" y="149" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 1</text>
  <rect x="330" y="158" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="175" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Export</text>
  <text x="420" y="175" font-size="11">0x35 to 0x6e</text>
  <text x="545" y="175" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 5</text>
  <rect x="330" y="184" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="201" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Code</text>
  <text x="420" y="201" font-size="11">0x71 to 0x10f</text>
  <text x="545" y="201" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 4</text>
  <rect x="330" y="210" width="290" height="26" fill="var(--m-paper, #fafaf5)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="340" y="227" font-size="11" font-weight="700" fill="var(--m-olive-ink, #515f26)">Data</text>
  <text x="420" y="227" font-size="11">0x111 to 0x122</text>
  <text x="545" y="227" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">count 1</text>
  <text x="330" y="258" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">wasm-validate --enable-all: exit 0, no output.</text>
  <text x="330" y="274" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">wasm2wat: 4 funcs, import env.log, data at 1024.</text>
  <text x="330" y="290" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">From capture/out/16-wabt.txt.</text>
</svg>
